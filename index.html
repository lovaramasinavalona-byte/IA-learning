<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's English Coach 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/font-awesome.min.css">
    <style>
        .chat-container { height: calc(100vh - 200px); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .user-msg { background: #3b82f6; color: white; border-radius: 18px 18px 0 18px; }
        .ai-msg { background: #f3f4f6; color: #1f2937; border-radius: 18px 18px 18px 0; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .listening { animation: pulse 1.5s infinite; color: #ef4444 !important; }
    </style>
</head>
<body class="bg-slate-100 font-sans leading-normal tracking-normal">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 glass p-4 rounded-2xl shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fas fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">Peter's English Coach</h1>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Intelligence Artificielle Pédagogique</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p class="text-xs font-bold text-blue-600" id="currentLevel">NIVEAU B1</p>
                    <p class="text-[10px] text-slate-400">Progression : 65%</p>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chatDisplay" class="chat-container overflow-y-auto mb-4 space-y-4 p-2 custom-scrollbar">
            <!-- Message de bienvenue -->
            <div class="flex justify-start">
                <div class="ai-msg p-4 max-w-[80%] shadow-sm">
                    <p class="text-sm">Hello Peter! I'm your English Coach. Ready to practice today? You can type your sentence or use the microphone. 🇬🇧</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="glass p-4 rounded-2xl shadow-lg border border-white">
            <div class="flex items-center space-x-2">
                <button id="micBtn" onclick="toggleSpeech()" class="p-3 text-slate-400 hover:text-blue-600 transition-colors">
                    <i class="fas fa-microphone text-xl"></i>
                </button>
                <input type="text" id="userInput" 
                       class="flex-1 bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-400 text-sm" 
                       placeholder="Écrivez ou parlez en anglais..."
                       onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 transition-all shadow-md">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        
        <p class="text-center text-[10px] text-slate-400 mt-4 italic">Développé par Peter - Powered by Gemini AI</p>
    </div>

    <script>
        let isListening = false;
        const recognition = 'webkitSpeechRecognition' in window ? new webkitSpeechRecognition() : null;
        
        if (recognition) {
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMessage();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
            };
        }

        function toggleSpeech() {
            if (!recognition) return alert("Votre navigateur ne supporte pas la reconnaissance vocale.");
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            // Simulate AI Loading
            const loadingId = appendMessage('ai', '...');

            try {
                // Ici nous ferons le fetch vers ton futur backend Cloud (FastAPI)
                // Pour l'instant, simulation de réponse locale
                setTimeout(() => {
                    updateMessage(loadingId, `Interesting! Your sentence is correct, but a native speaker might say: "Actually, I'd love to..." instead of "${message}".`);
                }, 1000);
                
            } catch (error) {
                updateMessage(loadingId, "Désolé, j'ai eu un problème de connexion avec mon cerveau IA.");
            }
        }

        function appendMessage(role, text) {
            const chatDisplay = document.getElementById('chatDisplay');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div id="msg-${id}" class="${role === 'user' ? 'user-msg' : 'ai-msg'} p-4 max-w-[80%] shadow-sm text-sm">
                    ${text}
                </div>
            `;
            chatDisplay.appendChild(div);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return id;
        }

        function updateMessage(id, text) {
            const msg = document.getElementById(`msg-${id}`);
            if (msg) msg.innerText = text;
            const chatDisplay = document.getElementById('chatDisplay');
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }
    </script>
</body>
</html>
