<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's English Coach 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/font-awesome.min.css">
    <style>
        .chat-container { height: calc(100vh - 250px); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .user-msg { background: #3b82f6; color: white; border-radius: 18px 18px 0 18px; margin-left: auto; }
        .ai-msg { background: #f3f4f6; color: #1f2937; border-radius: 18px 18px 18px 0; }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div class="max-w-2xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-6 glass p-4 rounded-2xl shadow-sm border border-white">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">English Coach</h1>
                    <p class="text-[10px] text-blue-600 font-bold tracking-widest uppercase italic">By Peter</p>
                </div>
            </div>
            <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold uppercase">V1.0 Stable</span>
        </header>

        <div id="chatDisplay" class="chat-container overflow-y-auto mb-4 space-y-4 p-2"></div>

        <div class="glass p-3 rounded-2xl shadow-lg border border-white flex items-center space-x-2">
            <input type="text" id="userInput" class="flex-1 bg-transparent border-none focus:ring-0 text-sm p-2" placeholder="Type here..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 text-white w-10 h-10 rounded-xl hover:bg-blue-700 flex items-center justify-center">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="module">
        // Importation directe du SDK Google
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // TA CLÉ (Copiée exactement de ton image d8d945)
        const API_KEY = "AIzaSyA-voUowdU-LyVXQqt8IRCMiRTTLN0P9u4"; 
        
        const genAI = new GoogleGenerativeAI(API_KEY);
        // Utilisation du modèle Flash qui est le plus rapide pour le Web
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        window.sendMessage = async function() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';
            const loadingId = appendMessage('ai', 'Thinking...');

            try {
                // On force le format de réponse pour éviter les erreurs de lecture
                const result = await model.generateContent(`Tu es le coach d'anglais de Peter. Réponds à : "${message}"`);
                const response = await result.response;
                updateMessage(loadingId, response.text());
            } catch (error) {
                console.error("Détail de l'erreur:", error);
                updateMessage(loadingId, "Désolé Peter, il y a un blocage de sécurité. Vérifie que tu n'as pas de bloqueur de pub (AdBlock) activé sur cette page.");
            }
        }

        function appendMessage(role, text) {
            const chatDisplay = document.getElementById('chatDisplay');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div id="msg-${id}" class="${role === 'user' ? 'user-msg' : 'ai-msg'} p-3 max-w-[85%] shadow-sm text-sm">${text}</div>`;
            chatDisplay.appendChild(div);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return id;
        }

        function updateMessage(id, text) {
            const msg = document.getElementById(`msg-${id}`);
            if (msg) msg.innerText = text;
        }
    </script>
</body>
</html>
