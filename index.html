<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's English Coach 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/font-awesome.min.css">
    <style>
        .chat-container { height: calc(100vh - 250px); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .user-msg { background: #3b82f6; color: white; border-radius: 18px 18px 0 18px; margin-left: auto; }
        .ai-msg { background: #f3f4f6; color: #1f2937; border-radius: 18px 18px 18px 0; }
        .loading-dots::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div class="max-w-2xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-6 glass p-4 rounded-2xl shadow-sm border border-white">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">English Coach</h1>
                    <p class="text-[10px] text-blue-600 font-bold tracking-widest uppercase italic">By Peter</p>
                </div>
            </div>
            <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold uppercase">Système Prêt</span>
        </header>

        <div id="chatDisplay" class="chat-container overflow-y-auto mb-4 space-y-4 p-2">
            <div class="flex justify-start">
                <div class="ai-msg p-4 max-w-[85%] shadow-sm">
                    <p class="text-sm">Hello Peter! I'm your coach. I've updated my connection. Let's try again! 🇬🇧</p>
                </div>
            </div>
        </div>

        <div class="glass p-3 rounded-2xl shadow-lg border border-white flex items-center space-x-2">
            <input type="text" id="userInput" class="flex-1 bg-transparent border-none focus:ring-0 text-sm p-2" placeholder="Write something in English..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 text-white w-10 h-10 rounded-xl hover:bg-blue-700 flex items-center justify-center shadow-md active:scale-90 transition-all">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // TA CLÉ API
        const API_KEY = "AQ.Ab8RN6IE8j-3v-zzJqht4iDthuknTrk8FRdZk-jVHYgCQYZ5vw"; 
        
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        window.sendMessage = async function() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';
            btn.disabled = true;
            const loadingId = appendMessage('ai', 'Thinking');
            const msgElement = document.getElementById(`msg-${loadingId}`);
            msgElement.classList.add('loading-dots');

            try {
                const prompt = `Tu es Peter's English Coach. 
                1. Corrige la phrase : "${message}".
                2. Explique la faute en français simplement.
                3. Donne une version naturelle.
                4. Pose une question pour continuer.`;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                msgElement.classList.remove('loading-dots');
                updateMessage(loadingId, response.text());
            } catch (error) {
                console.error(error);
                msgElement.classList.remove('loading-dots');
                updateMessage(loadingId, "Connection error. Make sure your API key is correctly pasted in index.html at line 46.");
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(role, text) {
            const chatDisplay = document.getElementById('chatDisplay');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div id="msg-${id}" class="${role === 'user' ? 'user-msg' : 'ai-msg'} p-3 max-w-[85%] shadow-sm text-sm whitespace-pre-line">${text}</div>`;
            chatDisplay.appendChild(div);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return id;
        }

        function updateMessage(id, text) {
            const msg = document.getElementById(`msg-${id}`);
            if (msg) msg.innerText = text;
            document.getElementById('chatDisplay').scrollTop = document.getElementById('chatDisplay').scrollHeight;
        }
    </script>
</body>
</html>
